# QRPersonafy backup server: a plain WebDAV server (rclone) that stores the phone's encrypted
# backups in ./data. The phone encrypts everything before upload, so this server only ever
# holds ciphertext. Setup guide: README.md next to this file.
services:
  webdav:
    image: rclone/rclone:1.68.2
    restart: unless-stopped
    command:
      - serve
      - webdav
      - /data
      - --addr=:8080
      - --user=${QRP_USER:?set QRP_USER in .env}
      - --pass=${QRP_PASSWORD:?set QRP_PASSWORD in .env}
    ports:
      - "${QRP_PORT:-8080}:8080"
    volumes:
      - ./data:/data
