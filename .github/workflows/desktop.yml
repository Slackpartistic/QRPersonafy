name: Desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[test]"
      - run: python -m pytest -v
      - name: Export this runner's settings
        if: runner.os == 'Windows'
        run: |
          qrpersonafy export -o runner-profile.json
          qrpersonafy show runner-profile.json

  app:
    # The double-click Windows app: a folder with QRPersonafy.exe, Python and the web UI.
    # A folder rather than one self-extracting .exe, which fresh Windows installs often block.
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[build]"
      - name: Build the QRPersonafy folder
        run: >
          pyinstaller --onedir --windowed --noconfirm --name QRPersonafy
          --add-data "src/qrpersonafy/gui/web;qrpersonafy/gui/web"
          --collect-submodules qrpersonafy
          --icon installer/qrpersonafy.ico
          src/qrpersonafy/gui/__main__.py
      - name: Build the installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Qp "/DAppVersion=$version" installer\qrpersonafy.iss
      - uses: actions/upload-artifact@v4
        with:
          name: qrpersonafy-windows
          path: desktop/dist/QRPersonafy/
      - uses: actions/upload-artifact@v4
        with:
          name: qrpersonafy-windows-setup
          path: desktop/dist/QRPersonafy-Setup-*.exe
