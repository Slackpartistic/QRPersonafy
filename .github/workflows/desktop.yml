name: Desktop app

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: GNOME's settings schemas, for the test against the real gsettings
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libglib2.0-bin gsettings-desktop-schemas
      - run: pip install -e ".[test]"
      - run: python -m pytest -v
      - name: Export this runner's settings
        if: runner.os == 'Windows'
        run: |
          qrpersonafy export -o runner-profile.json
          qrpersonafy show runner-profile.json
      - name: Export and apply settings on a stand-in GNOME
        if: runner.os == 'Linux'
        env:
          XDG_CURRENT_DESKTOP: GNOME
          GSETTINGS_BACKEND: keyfile
        run: |
          qrpersonafy export -o runner-profile.json
          qrpersonafy show runner-profile.json
          qrpersonafy apply runner-profile.json

  app:
    # The double-click Windows app: a folder with QRPersonafy.exe, Python and the web UI.
    # A folder rather than one self-extracting .exe, which fresh Windows installs often block.
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ".[build]"
      - name: Windows file details (name, version) for QRPersonafy.exe
        run: python packaging/windows/version_info.py build/version_info.txt
      - name: Build the QRPersonafy folder
        run: >
          pyinstaller --onedir --windowed --noconfirm --name QRPersonafy
          --add-data "src/qrpersonafy/gui/web;qrpersonafy/gui/web"
          --collect-submodules qrpersonafy
          --icon installer/qrpersonafy.ico
          --version-file build/version_info.txt
          src/qrpersonafy/gui/__main__.py

      # Code signing through SignPath (docs/signing.md). It runs only for release tags, and only
      # once the repository has the SIGNPATH_ORGANIZATION_ID variable and the SIGNPATH_API_TOKEN
      # secret. Until then every build stays unsigned, exactly as before.
      - name: Is code signing set up?
        id: signing
        shell: bash
        env:
          ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -n "$ORG" ] && [ -n "$TOKEN" ] && [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing this build with SignPath."
          else
            echo "Not signing (only release tags are signed, once SignPath is set up)."
          fi
      - name: Upload the unsigned app folder for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-app
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-app
          path: desktop/dist/QRPersonafy/
      - name: Sign QRPersonafy.exe (approve the request in SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'QRPersonafy' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-folder
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # Leaves an hour to approve the request in SignPath.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/dist/signed-app
      - name: Use the signed app folder
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force dist\QRPersonafy
          Move-Item dist\signed-app dist\QRPersonafy
          Get-AuthenticodeSignature dist\QRPersonafy\QRPersonafy.exe | Format-List Status, SignerCertificate
      - name: Build the installer
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Qp "/DAppVersion=$version" installer\qrpersonafy.iss
      - name: Give the installer a fixed name for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-setup
        shell: pwsh
        run: |
          # A fixed name inside the upload, so SignPath's artifact configuration can find it.
          New-Item -ItemType Directory -Force dist\unsigned-setup | Out-Null
          $setup = Get-Item dist\QRPersonafy-Setup-*.exe
          Copy-Item $setup dist\unsigned-setup\QRPersonafy-Setup.exe
          "name=$($setup.Name)" >> $env:GITHUB_OUTPUT
      - name: Upload the unsigned installer for signing
        if: steps.signing.outputs.enabled == 'true'
        id: unsigned-setup-artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-setup
          path: desktop/dist/unsigned-setup/
      - name: Sign the installer (approve the request in SignPath)
        if: steps.signing.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'QRPersonafy' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: desktop/dist/signed-setup
      - name: Use the signed installer
        if: steps.signing.outputs.enabled == 'true'
        shell: pwsh
        env:
          SETUP_NAME: ${{ steps.unsigned-setup.outputs.name }}
        run: |
          Copy-Item -Force dist\signed-setup\QRPersonafy-Setup.exe "dist\$env:SETUP_NAME"
          Get-AuthenticodeSignature "dist\$env:SETUP_NAME" | Format-List Status, SignerCertificate
      - uses: actions/upload-artifact@v4
        with:
          name: qrpersonafy-windows
          path: desktop/dist/QRPersonafy/
      - uses: actions/upload-artifact@v4
        with:
          name: qrpersonafy-windows-setup
          path: desktop/dist/QRPersonafy-Setup-*.exe

  linux-app:
    # The Linux app: an AppImage that runs on any distribution, and the same folder as a tarball.
    # Built on the oldest supported Ubuntu, so it runs on distributions at least that new.
    needs: test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Libraries Qt needs to open a window, and a virtual screen for the smoke test
        run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          xvfb desktop-file-utils libegl1 libgl1 libnss3 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1
          libxcb-shape0 libxcb-render-util0 libxcb-image0 libxcb-xinerama0 libxcomposite1 libxdamage1
          libxrandr2 libxtst6 libasound2 libfontconfig1 libxkbfile1 libxshmfence1 libgbm1
      - run: pip install ".[build,linux-app]" pillow
      - name: Build the AppImage and tarball
        run: sh packaging/linux/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: qrpersonafy-linux-appimage
          path: desktop/dist/QRPersonafy-*.AppImage
      - uses: actions/upload-artifact@v4
        with:
          name: qrpersonafy-linux-tarball
          path: desktop/dist/QRPersonafy-*-linux-*.tar.gz
