name: Mobile app

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Use the release signing key
        # Repository secrets (see mobile/README.md). Pull requests from forks don't get them
        # and build with the debug key.
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE != ''
        run: |
          echo "$KEYSTORE" | base64 --decode > android/app/release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: qrpersonafy-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  backup-server:
    # Runs the phone's backup code against the real Docker backup server from backup-server/.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the backup server
        working-directory: backup-server
        run: |
          printf 'QRP_USER=ci\nQRP_PASSWORD=ci-password\nQRP_PORT=8080\n' > .env
          docker compose up -d
          for i in $(seq 30); do curl -s -o /dev/null -u ci:ci-password -X PROPFIND -H 'Depth: 0' http://127.0.0.1:8080/ && break; sleep 1; done
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - name: Back up and restore through it
        working-directory: mobile
        env:
          QRP_DAV_URL: http://127.0.0.1:8080/QRPersonafy
          QRP_DAV_USER: ci
          QRP_DAV_PASSWORD: ci-password
        run: |
          flutter pub get
          flutter test test/backup_server_test.dart
