[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qrpersonafy"
version = "0.1.0"
description = "Save and restore Windows personalization."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cryptography>=42", "qrcode>=7.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
qrpersonafy = "qrpersonafy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: changes real settings; only runs on Windows"]
