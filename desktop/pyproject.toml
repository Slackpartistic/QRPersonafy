[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qrestoa"
version = "1.2.0"
description = "QRestoa: save and restore your desktop look on Windows and Linux, with your phone."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "cryptography>=42",
    "qrcode>=7.4",
    "pywebview>=5; sys_platform == 'win32'",
]

[project.optional-dependencies]
test = ["pytest>=8"]
build = ["pyinstaller>=6"]
# The window on Linux. pywebview can also use the system's GTK (python3-gi and WebKitGTK).
linux-app = ["pywebview[qt]>=5"]

# The Python package is still called qrpersonafy (the app's first name); the old command names
# stay as aliases so existing scripts keep working.
[project.scripts]
qrestoa = "qrpersonafy.cli:main"
qrpersonafy = "qrpersonafy.cli:main"

[project.gui-scripts]
qrestoa-gui = "qrpersonafy.gui.app:main"
qrpersonafy-gui = "qrpersonafy.gui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qrpersonafy = ["gui/web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["windows: changes real settings; only runs on Windows"]
